{% extends "base.html" %}
{% block title %}Create Trip — GlobeTrotter{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            
            <div class="mb-4 text-center">
                <span class="badge bg-primary bg-opacity-10 text-primary fw-bold px-3 py-1.5 rounded-pill mb-2">Step 1 of 2</span>
                <h2 class="fw-bold">Configure Your New Trip</h2>
                <p class="text-muted small">Establish your base dates and budget cap before scheduling individual stops.</p>
            </div>

            <div class="gt-card p-4 p-md-5 border-0 shadow-sm">
                <form method="POST" action="{{ url_for('create_trip') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-secondary">Trip Name</label>
                        <input type="text" name="name" class="form-control form-control-lg rounded-3 fs-6" placeholder="e.g., Summer Rail Tour 2026" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-secondary">Description & Notes (Optional)</label>
                        <textarea name="description" class="form-control rounded-3" rows="3" placeholder="Key objectives, travel companions, or packing highlights..."></textarea>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <label class="form-label fw-bold small text-secondary"><i class="bi bi-calendar-event me-1"></i> Start Date</label>
                            <input type="date" name="start_date" class="form-control rounded-3" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-bold small text-secondary"><i class="bi bi-calendar-check me-1"></i> End Date</label>
                            <input type="date" name="end_date" class="form-control rounded-3" required>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="form-label fw-bold small text-secondary"><i class="bi bi-cash-stack me-1"></i> Total Target Budget Limit ($ USD)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light fw-bold text-muted">$</span>
                            <input type="number" step="50" name="budget_limit" class="form-control form-control-lg rounded-end-3 fs-6" value="1200" required>
                        </div>
                        <div class="form-text small">Used to calculate your real-time budget utilization.</div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary px-4 py-2.5 rounded-3">Cancel</a>
                        <button type="submit" class="btn btn-gt-primary px-5 py-2.5 d-flex align-items-center gap-2">
                            <span>Continue to Itinerary</span>
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
