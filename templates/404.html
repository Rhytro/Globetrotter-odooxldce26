{% extends "base.html" %}
{% block title %}Page Not Found (404) — GlobeTrotter{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
    <div class="max-w-md mx-auto py-5">
        <h1 class="display-1 fw-extrabold text-primary mb-2">404</h1>
        <h3 class="fw-bold mb-2">You've Wandered Off the Map</h3>
        <p class="text-muted small mb-4">The route or resource you are trying to visit does not exist or has been relocated.</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-gt-primary px-4 py-2.5">
            <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
