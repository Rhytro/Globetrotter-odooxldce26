{% extends "base.html" %}
{% block title %}Dashboard - GlobeTrotter{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card shadow-sm border-0 p-4">
            <h2>Welcome, {{ current_user.username }}! 🎉</h2>

        </div>
    </div>
</div>
{% endblock %}
