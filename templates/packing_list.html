<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Packing List - {{ trip.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { border: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-radius: 0.75rem; }
        .form-check-input:checked { background-color: #0d9488; border-color: #0d9488; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <a href="/trips" class="text-decoration-none text-muted small mb-1 d-inline-block">
                            <i class="bi bi-arrow-left"></i> Back to Trips
                        </a>
                        <h1 class="fw-bold text-dark mb-0">🎒 Smart Packing List</h1>
                        <p class="text-muted">Tailored automatically for <strong>{{ trip.name }}</strong></p>
                    </div>
                    <a href="/trips/{{ trip.id }}/budget" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-wallet2"></i> View Budget
                    </a>
                </div>

                <div class="card p-4 mb-4 bg-white">
                    <div class="d-flex align-items-center mb-3">
                        <div class="bg-light p-3 rounded-circle me-3 text-success fs-4">
                            <i class="bi bi-magic"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-1">AI-Generated Recommendations</h5>
                            <p class="text-muted small mb-0">Based on your itinerary destinations and regional climate profiles.</p>
                        </div>
                    </div>

                    <hr class="my-3">

                    <div class="list-group list-group-flush">
                        {% for item in items %}
                            <label class="list-group-item py-3 d-flex align-items-center border-0 px-0">
                                <input class="form-check-input me-3 fs-5" type="checkbox" value="" id="item-{{ loop.index }}">
                                <span class="fs-6 text-dark flex-grow-1">{{ item }}</span>
                            </label>
                        {% endfor %}
                    </div>
                </div>

                <div class="text-center">
                    <button onclick="location.reload();" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-arrow-clockwise"></i> Reset Checklist
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
